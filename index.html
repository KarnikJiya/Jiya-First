<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Learning App</title>

  <!-- 1. TAILWIND CSS CDN (For Styling) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. REQUIRED CONFETTI ENGINE (Canvas-Confetti CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex flex-col items-center justify-center space-y-6">

  <div class="w-full max-w-md space-y-6">
    
    <!-- ========================================================= -->
    <!-- WEEKLY LEARNING QUESTION EXAMPLE INPUT                    -->
    <!-- ========================================================= -->
    <div class="bg-purple-900/40 p-4 rounded-2xl border border-purple-500/30 space-y-2">
      <label class="text-xs font-bold text-purple-300 uppercase tracking-wider block">Weekly Question</label>
      <div class="flex items-center gap-2">
        <input 
          type="text" 
          id="task1Title" 
          value="Write 3 letter 5 words" 
          oninput="saveUserData()" 
          class="w-full font-bold text-white bg-transparent border-b border-purple-400 focus:outline-none py-1"
        />
        <input 
          type="checkbox" 
          class="w-6 h-6 accent-purple-500 cursor-pointer flex-shrink-0" 
        />
      </div>
    </div>

    <!-- ========================================================= -->
    <!-- EDITABLE "YOU LIKE IT, YOU SNAP IT!" CARD                 -->
    <!-- ========================================================= -->
    <div id="aboutMeCard" class="p-5 rounded-2xl border-2 shadow-xl space-y-4 transition-colors duration-500">
      
      <!-- Card Header -->
      <div class="flex items-center justify-between gap-2">
        <input 
          type="text" 
          id="aboutMeTitle" 
          value="📸 You like it, You Snap it!" 
          oninput="saveUserData()" 
          class="font-black text-lg bg-transparent border-b border-white/40 focus:outline-none w-full"
        />
        <span class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-bold whitespace-nowrap">Photo Challenge</span>
      </div>

      <!-- Editable Challenge Prompts -->
      <div class="space-y-3">
        <div>
          <label class="text-xs font-bold uppercase tracking-wider block mb-1 opacity-90">Prompt 1</label>
          <input 
            type="text" 
            id="aboutMePrompt1" 
            value="🥰👀 Just a little something that caught my eye. 👀🥰" 
            oninput="saveUserData()" 
          />
        </div>

        <div>
          <label class="text-xs font-bold uppercase tracking-wider block mb-1 opacity-90">Prompt 2</label>
          <input 
            type="text" 
            id="aboutMePrompt2" 
            value="Write 3 things you love about the sea!" 
            oninput="saveUserData()" 
          />
        </div>
      </div>

      <!-- ========================================================= -->
      <!-- PHOTO CONTAINER WITH MINUS/PLUS STAR (➖⭐ / ➕⭐) RULES  -->
      <!-- ========================================================= -->
      <div class="space-y-2 pt-2 border-t border-white/20">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold uppercase tracking-wider opacity-90">Snapped Photo</span>
          
          <div class="flex items-center gap-2">
            <!-- Hidden File Input -->
            <input 
              type="file" 
              id="photoUploadInput" 
              accept="image/*" 
              class="hidden" 
              onchange="handlePhotoUpload(event)" 
            />

            <!-- Remove Picture Button (➖⭐) -->
            <button 
              type="button" 
              onclick="removePicture()" 
              title="Remove Picture"
              class="px-2.5 py-1 text-xs font-bold bg-red-500/80 hover:bg-red-500 text-white rounded-lg transition transform active:scale-95 flex items-center gap-1 cursor-pointer">
              ➖⭐ Remove
            </button>

            <!-- Add / Replace Picture Button (➕⭐) -->
            <button 
              type="button" 
              onclick="document.getElementById('photoUploadInput').click()" 
              title="Add or Replace Picture"
              class="px-2.5 py-1 text-xs font-bold bg-emerald-500/80 hover:bg-emerald-500 text-white rounded-lg transition transform active:scale-95 flex items-center gap-1 cursor-pointer">
              ➕⭐ Add Photo
            </button>
          </div>
        </div>

        <!-- Image Preview Area -->
        <div id="photoPreviewContainer" class="hidden relative rounded-xl overflow-hidden border border-white/30 shadow-md">
          <img id="photoPreview" src="" alt="Snapped Photo" class="w-full max-h-56 object-cover" />
        </div>
      </div>

      <!-- Completion Button -->
      <button 
        type="button" 
        onclick="triggerTaskCompletionConfetti(); saveUserData();" 
        class="task-submit-btn w-full py-3 mt-2 bg-yellow-400 hover:bg-yellow-300 text-purple-950 font-black rounded-xl shadow-lg transition transform active:scale-95 cursor-pointer">
        ✨ Complete & Splash! 🧜‍♀️
      </button>

    </div>

  </div>

  <!-- ========================================================= -->
  <!-- FULL APPLICATION JAVASCRIPT LOGIC                         -->
  <!-- ========================================================= -->
  <script>
    // ---------------------------------------------------------
    // 1. PHOTO MANAGEMENT (ADD ➕⭐ & REMOVE ➖⭐)
    // ---------------------------------------------------------
    let currentPhotoBase64 = null;

    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        currentPhotoBase64 = e.target.result;
        displayPhoto(currentPhotoBase64);
        saveUserData();
      };
      reader.readAsDataURL(file);
    }

    function removePicture() {
      // 1. Reset variable
      currentPhotoBase64 = null;

      // 2. Clear UI components
      const previewContainer = document.getElementById('photoPreviewContainer');
      const previewImg = document.getElementById('photoPreview');
      const fileInput = document.getElementById('photoUploadInput');

      if (previewImg) previewImg.src = '';
      if (previewContainer) previewContainer.classList.add('hidden');
      if (fileInput) fileInput.value = '';

      // 3. Save state with photo explicit null to persist deletion
      saveUserData();
    }

    function displayPhoto(base64Data) {
      const previewContainer = document.getElementById('photoPreviewContainer');
      const previewImg = document.getElementById('photoPreview');

      if (base64Data && previewImg && previewContainer) {
        previewImg.src = base64Data;
        previewContainer.classList.remove('hidden');
      } else if (previewContainer) {
        previewContainer.classList.add('hidden');
      }
    }

    // ---------------------------------------------------------
    // 2. SUPABASE & LOCAL STORAGE SYNC
    // ---------------------------------------------------------
    async function saveUserData() {
      const task1Title = document.getElementById('task1Title')?.value || '';
      const aboutMeTitle = document.getElementById('aboutMeTitle')?.value || '';
      const aboutMePrompt1 = document.getElementById('aboutMePrompt1')?.value || '';
      const aboutMePrompt2 = document.getElementById('aboutMePrompt2')?.value || '';

      const stateData = {
        task1Title,
        aboutMeTitle,
        aboutMePrompt1,
        aboutMePrompt2,
        photoData: currentPhotoBase64, // Explicitly saved as null if removed
        updated_at: new Date().toISOString()
      };

      // Save locally for instant rendering
      localStorage.setItem('userAppState', JSON.stringify(stateData));

      // Sync to Supabase database if client exists
      if (typeof supabase !== 'undefined' && supabase) {
        try {
          const { error } = await supabase
            .from('app_state')
            .upsert([{ id: 1, state: stateData }]);
          if (error) console.error('Supabase Sync Error:', error);
        } catch (err) {
          console.error('Network/Supabase Error:', err);
        }
      }
    }

    async function loadUserData() {
      let state = null;

      if (typeof supabase !== 'undefined' && supabase) {
        try {
          const { data } = await supabase
            .from('app_state')
            .select('state')
            .eq('id', 1)
            .single();
          if (data && data.state) state = data.state;
        } catch (err) {
          console.warn('Falling back to LocalStorage:', err);
        }
      }

      if (!state) {
        const local = localStorage.getItem('userAppState');
        if (local) state = JSON.parse(local);
      }

      if (state) {
        if (document.getElementById('task1Title') && state.task1Title) {
          document.getElementById('task1Title').value = state.task1Title;
        }
        if (document.getElementById('aboutMeTitle') && state.aboutMeTitle) {
          document.getElementById('aboutMeTitle').value = state.aboutMeTitle;
        }
        if (document.getElementById('aboutMePrompt1') && state.aboutMePrompt1) {
          document.getElementById('aboutMePrompt1').value = state.aboutMePrompt1;
        }
        if (document.getElementById('aboutMePrompt2') && state.aboutMePrompt2) {
          document.getElementById('aboutMePrompt2').value = state.aboutMePrompt2;
        }
        if (state.photoData) {
          currentPhotoBase64 = state.photoData;
          displayPhoto(currentPhotoBase64);
        } else {
          // Explicitly clear photo if state has no photoData
          currentPhotoBase64 = null;
          displayPhoto(null);
        }
      }
    }

    // ---------------------------------------------------------
    // 3. 24-HOUR ROTATING DAILY COLOR THEMES
    // ---------------------------------------------------------
    function applyDailyColorTheme() {
      const card = document.getElementById('aboutMeCard');
      if (!card) return;

      const themes = [
        { bg: 'bg-purple-600', border: 'border-purple-300', text: 'text-purple-100', inputBg: 'bg-purple-700/50' },
        { bg: 'bg-sky-600', border: 'border-sky-300', text: 'text-sky-100', inputBg: 'bg-sky-700/50' },
        { bg: 'bg-teal-600', border: 'border-teal-300', text: 'text-teal-100', inputBg: 'bg-teal-700/50' },
        { bg: 'bg-pink-600', border: 'border-pink-300', text: 'text-pink-100', inputBg: 'bg-pink-700/50' }
      ];

      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      const diff = now - start;
      const oneDay = 1000 * 60 * 60 * 24;
      const dayOfYear = Math.floor(diff / oneDay);

      const todayTheme = themes[dayOfYear % themes.length];

      card.className = `p-5 rounded-2xl border-2 shadow-xl space-y-4 transition-colors duration-500 ${todayTheme.bg} ${todayTheme.border} ${todayTheme.text}`;

      const inputs = card.querySelectorAll('input[type="text"]');
      inputs.forEach(input => {
        if (input.id !== 'aboutMeTitle') {
          input.className = `w-full font-bold px-3 py-2 rounded-lg text-white placeholder-white/70 border border-white/30 focus:outline-none focus:ring-2 focus:ring-white/80 ${todayTheme.inputBg}`;
        }
      });
    }

    // ---------------------------------------------------------
    // 4. FULL CONFETTI (STANDARD CANNONS + MERMAID WATER SPLASH)
    // ---------------------------------------------------------
    function triggerTaskCompletionConfetti() {
      if (typeof confetti === 'function') {
        // Left & Right Colorful Confetti Cannons
        confetti({
          particleCount: 45,
          angle: 60,
          spread: 60,
          origin: { x: 0.1, y: 0.7 },
          colors: ['#ff71ce', '#01cdfe', '#05ffa1', '#b967ff', '#fffb96']
        });

        confetti({
          particleCount: 45,
          angle: 120,
          spread: 60,
          origin: { x: 0.9, y: 0.7 },
          colors: ['#ff71ce', '#01cdfe', '#05ffa1', '#b967ff', '#fffb96']
        });

        // Center Leaping Mermaid + Splash Emojis
        const scalar = 2.8;
        const mermaidShape = confetti.shapeFromText({ text: '🧜‍♀️️', scalar });
        const splashShape = confetti.shapeFromText({ text: '💦', scalar: 2.2 });
        const waveShape = confetti.shapeFromText({ text: '🌊', scalar: 2.2 });
        const starShape = confetti.shapeFromText({ text: '⭐', scalar: 2.0 });

        confetti({
          particleCount: 22,
          spread: 110,
          startVelocity: 48,
          origin: { x: 0.5, y: 0.65 },
          shapes: [mermaidShape, splashShape, waveShape, starShape],
          scalar
        });
      } else {
        renderDOMMermaidSplash();
      }
    }

    // DOM Fallback if CDN fails
    function renderDOMMermaidSplash() {
      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 pointer-events-none z-50 flex items-center justify-center overflow-hidden';
      overlay.innerHTML = `
        <div class="animate-bounce text-center transform scale-150 transition-all duration-700">
          <div class="text-9xl filter drop-shadow-2xl">🧜‍♀️</div>
          <div class="text-5xl mt-2">💦 🌊 ⭐ 💦</div>
        </div>
      `;
      document.body.appendChild(overlay);

      setTimeout(() => {
        overlay.classList.add('opacity-0');
        setTimeout(() => overlay.remove(), 700);
      }, 1200);
    }

    // ---------------------------------------------------------
    // 5. ATTACH LISTENERS TO ALL TASKS (CHECKBOXES & BUTTONS)
    // ---------------------------------------------------------
    function attachTaskEventListeners() {
      const taskCheckboxes = document.querySelectorAll('input[type="checkbox"]');
      taskCheckboxes.forEach(checkbox => {
        if (!checkbox.dataset.mermaidBound) {
          checkbox.dataset.mermaidBound = "true";
          checkbox.addEventListener('change', (e) => {
            if (e.target.checked) {
              triggerTaskCompletionConfetti();
            }
          });
        }
      });

      const submitBtns = document.querySelectorAll('.task-submit-btn, button[type="submit"], .complete-task-btn');
      submitBtns.forEach(btn => {
        if (!btn.dataset.mermaidBound) {
          btn.dataset.mermaidBound = "true";
          btn.addEventListener('click', () => {
            triggerTaskCompletionConfetti();
          });
        }
      });
    }

    // Initialize on Page Load
    document.addEventListener('DOMContentLoaded', () => {
      loadUserData();
      applyDailyColorTheme();
      attachTaskEventListeners();
    });
  </script>
</body>
</html>
